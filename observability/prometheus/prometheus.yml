global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: loja-veloz
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000", "pedidos:8000", "pagamentos:8000", "estoque:8000"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: app
  - job_name: otel-collector-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
