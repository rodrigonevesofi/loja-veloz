# Pipeline de entrega contínua da plataforma Pedidos Veloz.
#
#   PR ............ lint -> testes -> validação de manifests/IaC -> e2e (Compose) -> build + scan (sem push)
#   push main ..... tudo acima -> push das imagens (sha-<commit>) -> deploy automático em STAGING
#   tag vX.Y.Z .... tudo acima -> staging -> aprovação manual -> PRODUÇÃO (canary em Pedidos)
#
# "Build once, deploy many": a MESMA imagem (mesmo digest) passa por staging e produção.
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read            # mínimo por padrão; cada job pede só o que precisa

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  KUSTOMIZE_VERSION: "5.5.0"
  KUBECONFORM_VERSION: "0.6.7"

jobs:
  # ------------------------------------------------------------------ qualidade estática
  lint:
    name: Lint (Python, Dockerfile, shell, Compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.6
      - run: ruff check --output-format=github . && ruff format --check .
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          config: .hadolint.yaml
      - run: shellcheck scripts/*.sh deploy/compose/postgres/*.sh
      - run: docker compose config --quiet

  test:
    name: Testes (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: veloz-common, dir: libs/veloz_common, req: services/gateway/requirements.txt }
          - { name: gateway, dir: services/gateway, req: services/gateway/requirements.txt }
          - { name: pedidos, dir: services/pedidos, req: services/pedidos/requirements.txt }
          - { name: pagamentos, dir: services/pagamentos, req: services/pagamentos/requirements.txt }
          - { name: estoque, dir: services/estoque, req: services/estoque/requirements.txt }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.req }}
      - run: pip install -r ${{ matrix.req }} ./libs/veloz_common pytest==9.2.0
      - name: pytest
        working-directory: ${{ matrix.dir }}
        env:
          OTEL_SDK_DISABLED: "true"
          PYTHONPATH: "."
        run: pytest -q --junitxml=../../reports/junit-${{ matrix.name }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.name }}
          path: reports/

  validate-manifests:
    name: Kubernetes (kustomize + kubeconform + misconfig scan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kustomize e kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
      - name: Renderizar e validar cada overlay contra o schema da API
        run: |
          mkdir -p rendered
          for target in overlays/local overlays/staging overlays/prod platform; do
            out="rendered/$(basename "$target").yaml"
            kustomize build "deploy/k8s/$target" > "$out"
            kubeconform -strict -summary -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$out"
          done
      - name: Scan de configuração insegura (Trivy misconfig)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: rendered/
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: manifests-renderizados
          path: rendered/

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive infra/terraform
      - name: "validate (sem backend, não precisa de credenciais)"
        run: |
          for env in staging prod; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done

  e2e:
    name: E2E com Docker Compose
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Subir a plataforma inteira (mesmo comando do dev)
        run: docker compose up -d --build --wait --wait-timeout 180
      - run: python3 scripts/smoke_test.py --base-url http://localhost:8080
      - if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ artefatos
  build:
    name: Imagem ${{ matrix.service }}
    needs: [e2e, validate-manifests, terraform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write          # push no GHCR com o GITHUB_TOKEN efêmero (sem segredo de longa duração)
      security-events: write   # publica o resultado do scan na aba Security
    strategy:
      matrix:
        service: [gateway, pedidos, pagamentos, estoque]
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/loja-veloz-${{ matrix.service }}
          # tags imutáveis: sha-<commit> sempre; X.Y.Z e X.Y em releases. Nada de :latest.
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - name: Build (carregado localmente para o scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          load: true
          tags: scan/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan de vulnerabilidades (gate de segurança)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Push com SBOM e proveniência (SLSA)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

  # ------------------------------------------------------------------ entrega
  release-info:
    name: Tag da imagem
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy staging
    needs: release-info
    permissions:
      contents: read
      id-token: write          # OIDC -> role AWS temporária
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: ${{ needs.release-info.outputs.tag }}
    secrets: inherit

  deploy-production:
    name: Deploy produção
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-info, deploy-staging]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production   # Environment com "required reviewers" = aprovação manual
      image_tag: ${{ needs.release-info.outputs.tag }}
      canary: true
    secrets: inherit
