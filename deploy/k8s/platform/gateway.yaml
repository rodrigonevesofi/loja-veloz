# Gateway API implementada pelo Istio: o controlador cria o Deployment/Service (LoadBalancer -> NLB)
# do gateway automaticamente. TLS terminado aqui com certificado emitido pelo cert-manager
# (o certificado cobre o host do ambiente: api.lojaveloz.example ou api.staging.lojaveloz.example).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: loja-veloz-gw
  namespace: istio-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: lojaveloz-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: loja-veloz
