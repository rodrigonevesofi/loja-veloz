# O operador autentica na AWS via EKS Pod Identity / IRSA (role criada pelo Terraform):
# nenhuma access key estática no cluster.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: sa-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
