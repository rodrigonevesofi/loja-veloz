# Credenciais NUNCA ficam no Git. O External Secrets Operator lê o AWS Secrets Manager
# (segredo criado pelo Terraform/RDS, com rotação) e materializa o Secret do Kubernetes.
# O pod continua lendo um Secret comum via secretKeyRef: o código não sabe de onde ele veio.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pedidos-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: pedidos-db
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:5432/pedidos?sslmode=require"
  dataFrom:
    - extract:
        key: loja-veloz/prod/pedidos-db
---
